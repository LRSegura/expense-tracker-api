# User service client configuration
user-service/mp-rest/url=http://localhost:8080/user-service
user-service/mp-rest/scope=jakarta.inject.Singleton

# Server configuration
quarkus.http.port=8088

# Quarkus OIDC Configuration
quarkus.oidc.auth-server-url=http://localhost:8180/realms/expense-tracker
quarkus.oidc.client-id=ui-service
quarkus.oidc.credentials.secret=kM6CJbs2fJAE7qnyTjknb3f5sIVOAvzM
quarkus.oidc.application-type=web-app
quarkus.oidc.roles.source=accesstoken

# Logout configuration
quarkus.oidc.logout.path=/q/logout
quarkus.oidc.logout.post-logout-path=/logged-out

# Add session timeout configuration
quarkus.http.auth.session.timeout=PT30M

# Enable OIDC token propagation to REST clients
quarkus.oidc-client.auth-server-url=${quarkus.oidc.auth-server-url}
quarkus.oidc-client.client-id=${quarkus.oidc.client-id}
quarkus.oidc-client.credentials.secret=${quarkus.oidc.credentials.secret}

# REST Client configuration for User Service
quarkus.rest-client."com.dev2ever.UserServiceClient".url=http://localhost:8080/user-service
quarkus.rest-client."com.dev2ever.UserServiceClient".scope=jakarta.inject.Singleton

# Enable OIDC token propagation for REST clients
quarkus.rest-client."com.dev2ever.UserServiceClient".providers=com.dev2ever.OidcClientRequestFilter

# HTTP Security
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
# Make sure logged-out is accessible with any query parameters
quarkus.http.auth.permission.public.paths=/login,/login/*,/logged-out,/logged-out/*,/q/*,/VAADIN/*,/HEARTBEAT/*,/UIDL/*,/favicon.ico
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.public.methods=GET,POST

# Session configuration
quarkus.http.auth.session.encryption-key=mysupersecretkey123456789012345

# CORS configuration (if needed)
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:8180,http://localhost:8088
quarkus.http.cors.methods=GET,PUT,POST,DELETE
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location,info
quarkus.http.cors.access-control-max-age=24H

# Vaadin specific
quarkus.vaadin.url-mapping=/ui/*

# For even quieter console (only WARN and ERROR)
quarkus.log.console.level=WARN